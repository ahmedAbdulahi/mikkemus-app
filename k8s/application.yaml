# Eksempel på skiperator Application-manifest for mikkemus-app.
# Bytt ut <ditt-registry-image> og ingress-hostnavnet før du bruker denne.
# Se eurocloud-repoet for hvordan dere setter opp registry/bygg av image.
apiVersion: skiperator.kartverket.no/v1alpha1
kind: Application
metadata:
  name: mikkemus-web
  namespace: mikkemus
spec:
  image: "ghcr.io/ahmedabdulahi/mikkemus-web:latest"
  port: 8080
  replicas: 1

  ingresses:
    - mikkemusss.51-158-58-170.nip.io # bytt til et ekte hostnavn når dere har et

  liveness:
    path: /
    port: 8080

  readiness:
    path: /
    port: 8080

  envFrom:
    - secret: mikkemus-db


  # Uten denne blokkerer skiperator sin NetworkPolicy/AuthorizationPolicy all
  # utgående trafikk til ting som ikke er en annen skiperator-Application.
  # Databasen er en ekstern Scaleway-tjeneste (nås via privat VPC-IP), så den
  # må whitelistes eksplisitt her. IP-en er samme som i mikkemus-db-secreten
  # (terraform output -raw mikkemus_db_connection_string i eurocloud-repoet).
  accessPolicy:
    outbound:
      external:
        - host: "172.16.0.3"
          ip: "172.16.0.3"
          ports:
            - name: postgres
              protocol: TCP
              port: 5432

  resources:
    requests:
      cpu: 25m
      memory: 128M
    limits:
      memory: 512M
